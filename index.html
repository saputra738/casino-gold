<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login & Daftar Akun</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #111 0%, #000 100%);
  font-family: "Poppins", sans-serif;
  color: #fff;
  overflow: hidden;
}
.container {
  width: 340px;
  background: linear-gradient(180deg, rgba(20,20,20,0.95), rgba(0,0,0,0.9));
  border: 1px solid #444;
  border-radius: 16px;
  box-shadow: 0 0 25px rgba(255,215,0,0.2);
  overflow: hidden;
  position: relative;
}
.header {
  text-align: center;
  padding: 15px 0 5px;
}
.header h1 {
  font-size: 20px;
  font-weight: 600;
  color: #ffd700;
  margin: 0;
  letter-spacing: 1px;
  text-shadow: 0 0 5px #b8860b;
}
.slide {
  width: 200%;
  display: flex;
  transition: transform 0.5s ease-in-out;
}
.box {
  width: 50%;
  padding: 20px;
  box-sizing: border-box;
}
h2 {
  margin-top: 10px;
  color: #ffd700;
  text-align: center;
  font-weight: 500;
  font-size: 18px;
}
input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #444;
  border-radius: 8px;
  background: #111;
  color: #ffd;
  font-size: 14px;
  outline: none;
  transition: 0.3s;
}
input:focus {
  border-color: #ffd700;
  box-shadow: 0 0 8px rgba(255,215,0,0.3);
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, #b8860b, #ffd700);
  color: #111;
  font-weight: 600;
  cursor: pointer;
  font-size: 15px;
  letter-spacing: 0.5px;
  transition: transform 0.2s;
}
button:hover {
  transform: scale(1.05);
  background: linear-gradient(90deg, #ffcc00, #ffe066);
}
.link {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: #bbb;
}
.link a {
  color: #ffd700;
  cursor: pointer;
  text-decoration: none;
}
.link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="container">
  <div class="header"><h1>CASINO GOLD</h1></div>
  <div class="slide" id="slideContainer">
    <!-- LOGIN -->
    <div class="box">
      <h2>Masuk Akun</h2>
      <input type="text" id="loginUsername" placeholder="Username" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button id="btnLogin">Login</button>
      <div class="link">
        <a id="showRegister">Belum punya akun? Daftar</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div class="box">
      <h2>Buat Akun Baru</h2>
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <button id="btnRegister">Daftar</button>
      <div class="link">
        <a id="showLogin">Sudah punya akun? Login</a>
      </div>
    </div>
  </div>
</div>

<script>
const slideContainer = document.getElementById('slideContainer');
const showRegister = document.getElementById('showRegister');
const showLogin = document.getElementById('showLogin');

showRegister.addEventListener('click',()=>{ slideContainer.style.transform='translateX(-50%)'; });
showLogin.addEventListener('click',()=>{ slideContainer.style.transform='translateX(0)'; });

// LOGIN
document.getElementById('btnLogin').addEventListener('click',()=>{
  const u = document.getElementById('loginUsername').value.trim();
  const p = document.getElementById('loginPassword').value.trim();
  if(!u || !p){ alert('Masukkan username dan password'); return; }
  const users = JSON.parse(localStorage.getItem('users')||'{}');
  if(!users[u]){ alert('Username tidak ditemukan'); return; }
  if(users[u].password !== p){ alert('Password salah'); return; }
  localStorage.setItem('currentUser', u);
  window.location='slot.html';
});

// REGISTER
document.getElementById('btnRegister').addEventListener('click',()=>{
  const u = document.getElementById('regUsername').value.trim();
  const p = document.getElementById('regPassword').value.trim();
  if(!u || !p){ alert('Masukkan username dan password'); return; }
  const users = JSON.parse(localStorage.getItem('users')||'{}');
  if(users[u]){ alert('Username sudah terdaftar'); return; }
  users[u] = {password:p, saldo:0};
  localStorage.setItem('users', JSON.stringify(users));
  alert('Akun berhasil dibuat! Silakan login.');
  slideContainer.style.transform='translateX(0)';
  document.getElementById('loginUsername').value = u;
  document.getElementById('loginPassword').value = '';
});
</script>

</body>
</html>
