<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Gold - Login</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7xEXAMPLE",
  authDomain: "casino-gold.firebaseapp.com",
  databaseURL: "https://casino-gold-default-rtdb.firebaseio.com",
  projectId: "casino-gold",
  storageBucket: "casino-gold.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123def456"
};

// Inisialisasi Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.addEventListener("DOMContentLoaded", () => {
  const daftarForm = document.getElementById("daftarForm");
  const loginForm = document.getElementById("loginForm");

  // Fungsi daftar
  daftarForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = document.getElementById("regUser").value.trim();
    const pass = document.getElementById("regPass").value.trim();

    if (!user || !pass) return alert("Isi semua kolom!");

    const dbRef = ref(db);
    const snap = await get(child(dbRef, "users/" + user));
    if (snap.exists()) {
      alert("Username sudah terdaftar!");
      return;
    }

    await set(ref(db, "users/" + user), {
      username: user,
      password: pass,
      saldo: 10000,
      createdAt: Date.now()
    });

    alert("Pendaftaran berhasil! Silakan login.");
    daftarForm.reset();
  });

  // Fungsi login
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value.trim();

    if (!user || !pass) return alert("Isi semua kolom!");

    const dbRef = ref(db);
    const snap = await get(child(dbRef, "users/" + user));

    if (!snap.exists()) {
      alert("User tidak ditemukan!");
      return;
    }

    const data = snap.val();
    if (data.password !== pass) {
      alert("Password salah!");
      return;
    }

    // Simpan sesi pengguna
    localStorage.setItem("currentUser", user);
    alert("Login berhasil!");

    if (user === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "slot.html";
    }
  });
});
</script>
</head>
<body style="font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px;">
  <h2>🎰 Casino Gold Login</h2>

  <form id="loginForm" style="margin-bottom:20px;">
    <input id="loginUser" placeholder="Username" required><br><br>
    <input id="loginPass" type="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
  </form>

  <h3>Daftar Akun Baru</h3>
  <form id="daftarForm">
    <input id="regUser" placeholder="Username" required><br><br>
    <input id="regPass" type="password" placeholder="Password" required><br><br>
    <button type="submit">Daftar</button>
  </form>
</body>
</html>
